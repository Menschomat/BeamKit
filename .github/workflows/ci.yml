name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: |
          if test -f package-lock.json; then
            npm ci
          else
            npm install
          fi
      - run: npm run check
      - run: npm test
      - run: npm run build
