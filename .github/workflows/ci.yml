name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run schema
      - run: git diff --exit-code -- public/project.schema.json public/legacy-grid.schema.json
      - run: npm run build
      - run: npm run check:assets
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - run: BEAMKIT_BROWSER=webkit npm run test:browser -- workflow.spec.ts
